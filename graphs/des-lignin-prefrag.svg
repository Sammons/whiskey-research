<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" style="background:#161b22;font-family:Georgia,serif">
<rect width="700" height="480" fill="#161b22"/>
<text x="350" y="25" fill="#e8a665" font-size="14" text-anchor="middle" font-weight="bold">Fig 78 — DES Lignin Pre-Fragmentation: β-O-4 Cleavage Creates Extractable Monomers</text>
<text x="195" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">A: Lignin Fractionation vs Temperature (Wang 2020)</text>
<rect x="80" y="70" width="230" height="280" fill="none" stroke="#8b949e" stroke-width="1"/>
<line x1="126" y1="350" x2="126" y2="354" stroke="#8b949e" stroke-width="0.5"/>
<text x="126" y="364" fill="#8b949e" font-size="7" text-anchor="middle">80°C</text>
<line x1="172" y1="350" x2="172" y2="354" stroke="#8b949e" stroke-width="0.5"/>
<text x="172" y="364" fill="#8b949e" font-size="7" text-anchor="middle">100°C</text>
<line x1="218" y1="350" x2="218" y2="354" stroke="#8b949e" stroke-width="0.5"/>
<text x="218" y="364" fill="#8b949e" font-size="7" text-anchor="middle">120°C</text>
<line x1="264" y1="350" x2="264" y2="354" stroke="#8b949e" stroke-width="0.5"/>
<text x="264" y="364" fill="#8b949e" font-size="7" text-anchor="middle">140°C</text>
<text x="195" y="378" fill="#8b949e" font-size="8" text-anchor="middle">DES treatment temperature</text>
<line x1="77" y1="350" x2="80" y2="350" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="353" fill="#8b949e" font-size="7" text-anchor="end">0%</text>
<line x1="77" y1="294" x2="80" y2="294" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="297" fill="#8b949e" font-size="7" text-anchor="end">20%</text>
<line x1="77" y1="238" x2="80" y2="238" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="241" fill="#8b949e" font-size="7" text-anchor="end">40%</text>
<line x1="77" y1="182" x2="80" y2="182" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="185" fill="#8b949e" font-size="7" text-anchor="end">60%</text>
<line x1="77" y1="126" x2="80" y2="126" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="129" fill="#8b949e" font-size="7" text-anchor="end">80%</text>
<line x1="77" y1="70" x2="80" y2="70" stroke="#8b949e" stroke-width="0.5"/>
<text x="75" y="73" fill="#8b949e" font-size="7" text-anchor="end">100%</text>
<text x="45" y="210" fill="#8b949e" font-size="7" text-anchor="middle">Lignin fraction (%)</text>
<polyline points="126.0,109.2 172.0,117.6 218.0,145.6 264.0,151.2" fill="none" stroke="#f85149" stroke-width="2.5"/>
<polyline points="126.0,322.0 172.0,305.2 218.0,285.6 264.0,294.0" fill="none" stroke="#3fb950" stroke-width="2.5"/>
<circle cx="126" cy="109.20000000000002" r="4" fill="#f85149" stroke="#e6edf3" stroke-width="1"/>
<circle cx="172" cy="117.60000000000002" r="4" fill="#f85149" stroke="#e6edf3" stroke-width="1"/>
<circle cx="218" cy="145.6" r="4" fill="#f85149" stroke="#e6edf3" stroke-width="1"/>
<circle cx="264" cy="151.20000000000002" r="4" fill="#f85149" stroke="#e6edf3" stroke-width="1"/>
<circle cx="126" cy="322" r="4" fill="#3fb950" stroke="#e6edf3" stroke-width="1"/>
<circle cx="172" cy="305.2" r="4" fill="#3fb950" stroke="#e6edf3" stroke-width="1"/>
<circle cx="218" cy="285.6" r="4" fill="#3fb950" stroke="#e6edf3" stroke-width="1"/>
<circle cx="264" cy="294" r="4" fill="#3fb950" stroke="#e6edf3" stroke-width="1"/>
<text x="240" y="143" fill="#f85149" font-size="7" text-anchor="start">Regenerated (intact)</text>
<text x="90" y="286" fill="#3fb950" font-size="7" text-anchor="start">Fragmented (monomers)</text>
<rect x="172" y="70" width="92" height="280" fill="#e8a665" opacity="0.08"/>
<text x="218" y="85" fill="#e8a665" font-size="7" text-anchor="middle">Optimal</text>
<text x="218" y="97" fill="#e8a665" font-size="6" text-anchor="middle">(16–23%</text>
<text x="218" y="107" fill="#e8a665" font-size="6" text-anchor="middle">fragmented)</text>
<rect x="85" y="295" width="130" height="30" rx="3" fill="#30363d" opacity="0.8"/>
<text x="150" y="308" fill="#e8a665" font-size="7" text-anchor="middle">ChCl:lactic acid (1:2)</text>
<text x="150" y="320" fill="#8b949e" font-size="6" text-anchor="middle">1 hour treatment</text>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Two-Step DES Pre-Fragmentation Protocol</text>
<rect x="395" y="75" width="130" height="80" rx="5" fill="#f85149" opacity="0.12" stroke="#f85149" stroke-width="1"/>
<text x="460" y="92" fill="#f85149" font-size="9" text-anchor="middle">Step 1: Fragment</text>
<text x="460" y="108" fill="#e6edf3" font-size="7" text-anchor="middle">ChCl/lactic acid DES</text>
<text x="460" y="122" fill="#e6edf3" font-size="7" text-anchor="middle">100–120°C, 1h</text>
<text x="460" y="138" fill="#e8a665" font-size="7" text-anchor="middle">β-O-4 cleavage</text>
<line x1="525" y1="115" x2="545" y2="115" stroke="#e8a665" stroke-width="2" marker-end="url(#arr)"/>
<rect x="555" y="75" width="130" height="80" rx="5" fill="#3fb950" opacity="0.12" stroke="#3fb950" stroke-width="1"/>
<text x="620" y="92" fill="#3fb950" font-size="9" text-anchor="middle">Step 2: Extract</text>
<text x="620" y="108" fill="#e6edf3" font-size="7" text-anchor="middle">UAE (§4.65) or fresh DES</text>
<text x="620" y="122" fill="#e6edf3" font-size="7" text-anchor="middle">40°C, 1h + US</text>
<text x="620" y="138" fill="#39d2c0" font-size="7" text-anchor="middle">5× with circulation</text>
<rect x="395" y="170" width="290" height="70" rx="5" fill="#30363d" opacity="0.7"/>
<text x="540" y="188" fill="#8b949e" font-size="8" text-anchor="middle">Products from pre-fragmented oak:</text>
<text x="540" y="205" fill="#e8a665" font-size="8" text-anchor="middle">Vanillin + Syringaldehyde + Ellagic acid</text>
<text x="540" y="222" fill="#3fb950" font-size="7" text-anchor="middle">(smaller fragments = faster extraction, richer aroma)</text>
<text x="525" y="260" fill="#e6edf3" font-size="10" text-anchor="middle">C: Sequential DES Protocol (Moccia 2022)</text>
<rect x="395" y="275" width="135" height="85" rx="4" fill="#e8a665" opacity="0.10"/>
<text x="462.5" y="292" fill="#e8a665" font-size="9" text-anchor="middle">DES #1</text>
<text x="462.5" y="306" fill="#e6edf3" font-size="7" text-anchor="middle">ChCl/tartaric acid</text>
<text x="462.5" y="320" fill="#e8a665" font-size="7" text-anchor="middle">→ Ellagic acid</text>
<text x="462.5" y="334" fill="#8b949e" font-size="6" text-anchor="middle">(selective)</text>
<text x="462.5" y="348" fill="#8b949e" font-size="6" text-anchor="middle">50°C, 90 min</text>
<rect x="545" y="275" width="135" height="85" rx="4" fill="#3fb950" opacity="0.10"/>
<text x="612.5" y="292" fill="#3fb950" font-size="9" text-anchor="middle">DES #2</text>
<text x="612.5" y="306" fill="#e6edf3" font-size="7" text-anchor="middle">ChCl/lactic acid</text>
<text x="612.5" y="320" fill="#3fb950" font-size="7" text-anchor="middle">→ Lignin fraction</text>
<text x="612.5" y="334" fill="#8b949e" font-size="6" text-anchor="middle">(vanillin, syringal.)</text>
<text x="612.5" y="348" fill="#8b949e" font-size="6" text-anchor="middle">Residual wood</text>
<line x1="530" y1="317" x2="545" y2="317" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="60" y="422" width="580" height="48" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="438" fill="#e8a665" font-size="8" text-anchor="middle">DES pre-treatment fragments lignin via β-O-4 cleavage before extraction</text>
<text x="350" y="452" fill="#3fb950" font-size="8" text-anchor="middle">23% fragmented at 120°C → smaller phenolic monomers → faster extraction by any method</text>
<text x="350" y="466" fill="#39d2c0" font-size="8" text-anchor="middle">Sequential DES (Moccia 2022) separates ellagitannins from lignin aromatics — precision phenolic profile control</text>
</svg>