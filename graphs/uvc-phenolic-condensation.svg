<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" style="background:#161b22;font-family:Georgia,serif">
<rect width="700" height="480" fill="#161b22"/>
<text x="350" y="25" fill="#e8a665" font-size="14" text-anchor="middle" font-weight="bold">Fig 70 — UV-C Phenolic Condensation: Accelerating the Same Chemistry as Barrel Aging</text>
<text x="190" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">A: UV-C Enhancement of Phenolic Products</text>
<rect x="100" y="75" width="220" height="265" fill="none" stroke="#8b949e" stroke-width="1"/>
<line x1="100" y1="75" x2="100" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="100" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+0%</text>
<line x1="144" y1="75" x2="144" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="144" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+20%</text>
<line x1="188" y1="75" x2="188" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="188" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+40%</text>
<line x1="232" y1="75" x2="232" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="232" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+60%</text>
<line x1="276" y1="75" x2="276" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="276" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+80%</text>
<line x1="320" y1="75" x2="320" y2="340" stroke="#30363d" stroke-width="0.5"/>
<text x="320" y="352" fill="#8b949e" font-size="7" text-anchor="middle">+100%</text>
<text x="210" y="366" fill="#8b949e" font-size="8" text-anchor="middle">Enhancement vs untreated control (Gindri 2021)</text>
<rect x="100" y="103.4" width="203.1" height="18.9" fill="#3fb950" opacity="0.7" rx="2"/>
<text x="307.05999999999995" y="115.85714285714286" fill="#3fb950" font-size="8" text-anchor="start">+92.3%</text>
<text x="96" y="115.85714285714286" fill="#8b949e" font-size="7" text-anchor="end">Direct condensation</text>
<rect x="100" y="141.2" width="138.2" height="18.9" fill="#e8a665" opacity="0.7" rx="2"/>
<text x="242.16" y="153.71428571428572" fill="#e8a665" font-size="8" text-anchor="start">+62.8%</text>
<text x="96" y="153.71428571428572" fill="#8b949e" font-size="7" text-anchor="end">AcH-mediated condensation</text>
<rect x="100" y="179.1" width="130.5" height="18.9" fill="#bc8cff" opacity="0.7" rx="2"/>
<text x="234.45999999999998" y="191.57142857142856" fill="#bc8cff" font-size="8" text-anchor="start">+59.3%</text>
<text x="96" y="191.57142857142856" fill="#8b949e" font-size="7" text-anchor="end">Pyranoanthocyanins</text>
<rect x="100" y="217.0" width="65.6" height="18.9" fill="#f85149" opacity="0.7" rx="2"/>
<text x="169.56" y="229.42857142857142" fill="#f85149" font-size="8" text-anchor="start">+29.8%</text>
<text x="96" y="229.42857142857142" fill="#8b949e" font-size="7" text-anchor="end">Polymeric color</text>
<rect x="100" y="254.8" width="57.6" height="18.9" fill="#d29922" opacity="0.7" rx="2"/>
<text x="161.64" y="267.2857142857143" fill="#d29922" font-size="8" text-anchor="start">+26.2%</text>
<text x="96" y="267.2857142857143" fill="#8b949e" font-size="7" text-anchor="end">Color intensity</text>
<rect x="100" y="292.7" width="49.5" height="18.9" fill="#58a6ff" opacity="0.7" rx="2"/>
<text x="153.5" y="305.1428571428571" fill="#58a6ff" font-size="8" text-anchor="start">+22.5%</text>
<text x="96" y="305.1428571428571" fill="#8b949e" font-size="7" text-anchor="end">Monomeric anthocyanins</text>
<rect x="98.0" y="137.5" width="260.0" height="26.5" fill="none" stroke="#e8a665" stroke-width="2" stroke-dasharray="3,2" rx="3"/>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Integrated UV-C + PEM Acetaldehyde</text>
<rect x="420" y="100.0" width="210" height="60" rx="6" fill="#3fb950" opacity="0.12" stroke="#3fb950" stroke-width="1.5"/>
<text x="525" y="124" fill="#3fb950" font-size="10" text-anchor="middle">PEM Electrolyzer</text>
<text x="525" y="142" fill="#8b949e" font-size="8" text-anchor="middle">EtOH → AcH (§4.53)</text>
<rect x="420" y="210.0" width="210" height="60" rx="6" fill="#bc8cff" opacity="0.12" stroke="#bc8cff" stroke-width="1.5"/>
<text x="525" y="234" fill="#bc8cff" font-size="10" text-anchor="middle">UV-C Exposure</text>
<text x="525" y="252" fill="#8b949e" font-size="8" text-anchor="middle">3 kJ/m² dose</text>
<rect x="420" y="320.0" width="210" height="60" rx="6" fill="#e8a665" opacity="0.12" stroke="#e8a665" stroke-width="1.5"/>
<text x="525" y="344" fill="#e8a665" font-size="10" text-anchor="middle">Phenolic Bridging</text>
<text x="525" y="362" fill="#8b949e" font-size="8" text-anchor="middle">AcH + phenol → polymer</text>
<line x1="525" y1="160" x2="525" y2="210" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="525" y1="270" x2="525" y2="320" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="410" y="395" width="230" height="32" rx="4" fill="#30363d" opacity="0.85"/>
<text x="525" y="408" fill="#e8a665" font-size="8" text-anchor="middle">Same polymeric pigments as 5-yr barrel aging</text>
<text x="525" y="422" fill="#3fb950" font-size="7" text-anchor="middle">Produced in hours, not years</text>
<rect x="60" y="410.0" width="580" height="52" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="428" fill="#e8a665" font-size="8" text-anchor="middle">UV-C accelerates the EXACT condensation chemistry of barrel aging</text>
<text x="350" y="442" fill="#3fb950" font-size="8" text-anchor="middle">+62.8% acetaldehyde-mediated phenolic bridging (Gindri 2021) at 3 kJ/m²</text>
<text x="350" y="456" fill="#58a6ff" font-size="8" text-anchor="middle">Feed with PEM acetaldehyde (§4.53) + oak phenolics (§3.10) = precision aging</text>
</svg>