<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Passive Catalysis Mechanism</text>
<rect x="390" y="65" width="270" height="310" fill="none" stroke="#8b949e" stroke-width="1"/>
<rect x="410" y="80" width="230" height="50" rx="4" fill="#58a6ff" opacity="0.10" stroke="#58a6ff" stroke-width="1"/>
<text x="525" y="100" fill="#58a6ff" font-size="8" text-anchor="middle">Day: Sun heats jar (ΔT = +25°C)</text>
<text x="525" y="117" fill="#58a6ff" font-size="7" text-anchor="middle">→ Crystal surface charges (+)</text>
<rect x="410" y="140" width="230" height="50" rx="4" fill="#bc8cff" opacity="0.10" stroke="#bc8cff" stroke-width="1"/>
<text x="525" y="160" fill="#bc8cff" font-size="8" text-anchor="middle">Night: Jar cools (ΔT = −25°C)</text>
<text x="525" y="177" fill="#bc8cff" font-size="7" text-anchor="middle">→ Crystal surface charges (−)</text>
<rect x="410" y="205" width="230" height="40" rx="4" fill="#3fb950" opacity="0.10" stroke="#3fb950" stroke-width="1"/>
<text x="525" y="222" fill="#3fb950" font-size="8" text-anchor="middle">E ≈ Q/(ε₀εᵣ) ≈ 10⁵ V/m near surface</text>
<text x="525" y="237" fill="#3fb950" font-size="7" text-anchor="middle">(comparable to PEF at 1–10 kV/cm)</text>
<rect x="410" y="260" width="230" height="120" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="278" fill="#e6edf3" font-size="8" text-anchor="middle">Quantitative Estimates</text>
<line x1="420" y1="285" x2="630" y2="285" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="302" fill="#8b949e" font-size="7" text-anchor="start">LiNbO₃ at ΔT=25°C:</text>
<text x="630" y="302" fill="#58a6ff" font-size="7" text-anchor="end">2,075 μC/m²</text>
<text x="425" y="318" fill="#8b949e" font-size="7" text-anchor="start">Near-surface E-field:</text>
<text x="630" y="318" fill="#3fb950" font-size="7" text-anchor="end">~10⁵ V/m</text>
<text x="425" y="334" fill="#8b949e" font-size="7" text-anchor="start">Decay length:</text>
<text x="630" y="334" fill="#e8a665" font-size="7" text-anchor="end">~10 μm (Debye)</text>
<text x="425" y="350" fill="#8b949e" font-size="7" text-anchor="start">Cycles/year:</text>
<text x="630" y="350" fill="#d29922" font-size="7" text-anchor="end">365 (daily thermal)</text>
<text x="425" y="366" fill="#8b949e" font-size="7" text-anchor="start">Power required:</text>
<text x="630" y="366" fill="#3fb950" font-size="7" text-anchor="end">Zero (passive)</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/><text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Pyroelectric crystals generate 10⁵ V/m E-fields passively from day/night thermal cycling</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">LiNbO₃ powder in spirit jar on windowsill = passive PEF-equivalent catalysis, zero electricity</text>
