<text x="295" y="80" fill="#3fb950" font-size="8" text-anchor="middle">Whiskey</text>
<rect x="80" y="95" width="120" height="46" rx="3" fill="#30363d" opacity="0.8"/>
<text x="85" y="110" fill="#8b949e" font-size="7" text-anchor="start">Shen &amp; Wu (2004):</text>
<text x="85" y="122" fill="#e8a665" font-size="7" text-anchor="start">40% EtOH: 3.5× faster</text>
<text x="85" y="134" fill="#e8a665" font-size="7" text-anchor="start">50% EtOH: 5.0× faster</text>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Four Mechanisms of Ethanol Acceleration</text>
<rect x="400" y="65" width="260" height="310" fill="none" stroke="#8b949e" stroke-width="1"/>
<rect x="410" y="111.5" width="240" height="44" rx="4" fill="#58a6ff" opacity="0.15" stroke="#58a6ff" stroke-width="1"/>
<text x="420" y="129.5" fill="#58a6ff" font-size="8" text-anchor="start">1. Lowered water activity</text>
<text x="420" y="143.5" fill="#e6edf3" font-size="7" text-anchor="start">Concentrates reactants</text>
<rect x="410" y="158" width="240" height="44" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="1"/>
<text x="420" y="176" fill="#3fb950" font-size="8" text-anchor="start">2. Higher initial pH</text>
<text x="420" y="190" fill="#e6edf3" font-size="7" text-anchor="start">Accelerates Amadori rearrangement</text>
<rect x="410" y="204.5" width="240" height="44" rx="4" fill="#d29922" opacity="0.15" stroke="#d29922" stroke-width="1"/>
<text x="420" y="222.5" fill="#d29922" font-size="8" text-anchor="start">3. Altered mutarotation</text>
<text x="420" y="236.5" fill="#e6edf3" font-size="7" text-anchor="start">More reactive open-chain glucose</text>
<rect x="410" y="251" width="240" height="44" rx="4" fill="#f85149" opacity="0.15" stroke="#f85149" stroke-width="1"/>
<text x="420" y="269" fill="#f85149" font-size="8" text-anchor="start">4. Unique product pathways</text>
<text x="420" y="283" fill="#e6edf3" font-size="7" text-anchor="start">2-Hydroxymethylfuran (EtOH only)</text>
<rect x="410" y="340" width="240" height="28" rx="3" fill="#30363d" opacity="0.8"/>
<text x="530" y="355" fill="#8b949e" font-size="7" text-anchor="middle">Chen &amp; He 2020: EtOH also accelerates AGE formation</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Ethanol is not inert — it actively accelerates Maillard 2.5–5× via four mechanisms (Shen &amp; Wu 2004).</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">Whiskey at 40–50% ABV runs Maillard chemistry 3–5× faster than equivalent aqueous system.</text>
