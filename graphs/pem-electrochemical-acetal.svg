<text x="350" y="442" fill="#3fb950" font-size="8" text-anchor="middle">Titratable acetaldehyde on demand — feeds Maillard (§4.6) + phenolic bridging (§3.8)</text>
<text x="350" y="456" fill="#58a6ff" font-size="8" text-anchor="middle">Non-noble-metal catalyst (Co oxide) reduces cost from $1000s (Pt/Au) to $10s</text>
