<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" style="background:#161b22;font-family:Georgia,serif">
<rect width="700" height="480" fill="#161b22"/>
<text x="350" y="25" fill="#e8a665" font-size="14" text-anchor="middle" font-weight="bold">Fig 68 — PEF-Fenton Radical Cascade: Electric Pulses + Dissolved O₂ + Oak Fe²⁺</text>
<text x="190" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">A: Flavor Compound Changes Under PEF + O₂</text>
<rect x="70" y="75" width="250" height="265" fill="none" stroke="#8b949e" stroke-width="1"/>
<line x1="120" y1="75" x2="120" y2="340" stroke="#e6edf3" stroke-width="1"/>
<line x1="70.0" y1="340" x2="70.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="70" y="353" fill="#8b949e" font-size="7" text-anchor="middle">-50%</text>
<line x1="120.0" y1="340" x2="120.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="120" y="353" fill="#8b949e" font-size="7" text-anchor="middle">0%</text>
<line x1="170.0" y1="340" x2="170.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="170" y="353" fill="#8b949e" font-size="7" text-anchor="middle">+50%</text>
<line x1="220.0" y1="340" x2="220.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="220" y="353" fill="#8b949e" font-size="7" text-anchor="middle">+100%</text>
<line x1="270.0" y1="340" x2="270.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="270" y="353" fill="#8b949e" font-size="7" text-anchor="middle">+150%</text>
<line x1="320.0" y1="340" x2="320.0" y2="343.0" stroke="#8b949e" stroke-width="0.5"/>
<text x="320" y="353" fill="#8b949e" font-size="7" text-anchor="middle">+200%</text>
<text x="195" y="366" fill="#8b949e" font-size="8" text-anchor="middle">Change vs untreated control</text>
<rect x="120.0" y="97.8" width="173.1" height="13.2" fill="#f85149" opacity="0.7" rx="2"/>
<text x="296.1" y="107.44444444444444" fill="#f85149" font-size="7" text-anchor="start">+173%</text>
<text x="66" y="107.44444444444444" fill="#8b949e" font-size="7" text-anchor="end">Octanoic acid</text>
<rect x="120.0" y="127.3" width="86.4" height="13.2" fill="#e8a665" opacity="0.7" rx="2"/>
<text x="209.4" y="136.88888888888889" fill="#e8a665" font-size="7" text-anchor="start">+86%</text>
<text x="66" y="136.88888888888889" fill="#8b949e" font-size="7" text-anchor="end">Hexanol</text>
<rect x="120.0" y="156.7" width="54.5" height="13.2" fill="#d29922" opacity="0.7" rx="2"/>
<text x="177.5" y="166.33333333333331" fill="#d29922" font-size="7" text-anchor="start">+54%</text>
<text x="66" y="166.33333333333331" fill="#8b949e" font-size="7" text-anchor="end">Hexanoic acid</text>
<rect x="120.0" y="186.2" width="7.2" height="13.2" fill="#3fb950" opacity="0.7" rx="2"/>
<text x="130.2" y="195.77777777777777" fill="#3fb950" font-size="7" text-anchor="start">+7%</text>
<text x="66" y="195.77777777777777" fill="#8b949e" font-size="7" text-anchor="end">Total esters</text>
<rect x="120.0" y="215.6" width="6.9" height="13.2" fill="#58a6ff" opacity="0.7" rx="2"/>
<text x="129.9" y="225.22222222222223" fill="#58a6ff" font-size="7" text-anchor="start">+7%</text>
<text x="66" y="225.22222222222223" fill="#8b949e" font-size="7" text-anchor="end">Ethyl hexanoate</text>
<rect x="120.0" y="245.0" width="37.7" height="13.2" fill="#bc8cff" opacity="0.7" rx="2"/>
<text x="160.7" y="254.66666666666666" fill="#bc8cff" font-size="7" text-anchor="start">+38%</text>
<text x="66" y="254.66666666666666" fill="#8b949e" font-size="7" text-anchor="end">Total acids</text>
<rect x="112.9" y="274.5" width="7.1" height="13.2" fill="#39d2c0" opacity="0.7" rx="2"/>
<text x="109.9" y="284.1111111111111" fill="#39d2c0" font-size="7" text-anchor="end">-7%</text>
<text x="66" y="284.1111111111111" fill="#8b949e" font-size="7" text-anchor="end">Acetaldehyde</text>
<rect x="109.5" y="303.9" width="10.5" height="13.2" fill="#8b949e" opacity="0.7" rx="2"/>
<text x="106.5" y="313.55555555555554" fill="#8b949e" font-size="7" text-anchor="end">-10%</text>
<text x="66" y="313.55555555555554" fill="#8b949e" font-size="7" text-anchor="end">Higher alcohols</text>
<rect x="120.0" y="75.0" width="200.0" height="265" fill="#3fb950" opacity="0.05"/>
<rect x="70" y="75" width="50.0" height="265" fill="#f85149" opacity="0.03"/>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: PEF-Fenton-Oak Radical Cascade</text>
<rect x="430" y="100.0" width="190" height="50" rx="6" fill="#bc8cff" opacity="0.12" stroke="#bc8cff" stroke-width="1.5"/>
<text x="525" y="120" fill="#bc8cff" font-size="10" text-anchor="middle">PEF</text>
<text x="525" y="136" fill="#8b949e" font-size="7" text-anchor="middle">25 kV/cm, 350 Hz</text>
<rect x="430" y="200.0" width="190" height="50" rx="6" fill="#58a6ff" opacity="0.12" stroke="#58a6ff" stroke-width="1.5"/>
<text x="525" y="220" fill="#58a6ff" font-size="10" text-anchor="middle">Dissolved O₂</text>
<text x="525" y="236" fill="#8b949e" font-size="7" text-anchor="middle">8.19 mg/L</text>
<rect x="430" y="300.0" width="190" height="50" rx="6" fill="#e8a665" opacity="0.12" stroke="#e8a665" stroke-width="1.5"/>
<text x="525" y="320" fill="#e8a665" font-size="10" text-anchor="middle">Oak Fe²⁺</text>
<text x="525" y="336" fill="#8b949e" font-size="7" text-anchor="middle">5–30 ppm</text>
<line x1="525" y1="150" x2="525" y2="200" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="545" y="175" fill="#3fb950" font-size="7" text-anchor="start">e⁻ + O₂ → O₂⁻•</text>
<line x1="525" y1="250" x2="525" y2="300" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="545" y="275" fill="#3fb950" font-size="7" text-anchor="start">Fe²⁺ + H₂O₂ → OH•</text>
<rect x="410" y="360" width="230" height="48" rx="4" fill="#30363d" opacity="0.85"/>
<text x="525" y="375" fill="#f85149" font-size="8" text-anchor="middle">OH• confirmed by EPR (Lu et al. 2025)</text>
<text x="525" y="391" fill="#3fb950" font-size="8" text-anchor="middle">+24.7% total flavor compounds at 500 Hz</text>
<text x="525" y="403" fill="#e8a665" font-size="7" text-anchor="middle">Hidden Fenton: oak supplies the Fe²⁺ (§4.45)</text>
<rect x="60" y="410.0" width="580" height="52" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="428" fill="#e8a665" font-size="8" text-anchor="middle">PEF (§4.15) + dissolved O₂ generates OH• radicals (EPR-confirmed)</text>
<text x="350" y="442" fill="#3fb950" font-size="8" text-anchor="middle">Oak-derived Fe²⁺ (§4.45) catalyzes the Fenton step — no added reagents</text>
<text x="350" y="456" fill="#58a6ff" font-size="8" text-anchor="middle">Novel: PEF is the radical generator, oak is the Fenton catalyst, O₂ is the terminal oxidant</text>
</svg>