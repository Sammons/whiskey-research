<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Magnetic Recovery Process</text>
<rect x="390" y="65" width="270" height="310" fill="none" stroke="#8b949e" stroke-width="1"/>
<rect x="410" y="80" width="230" height="40" rx="4" fill="#58a6ff" opacity="0.10" stroke="#58a6ff" stroke-width="1"/>
<text x="525" y="97" fill="#58a6ff" font-size="8" text-anchor="middle">1. Add Fe₃O₄-CALB beads to spirit</text>
<text x="525" y="113" fill="#58a6ff" font-size="7" text-anchor="middle">(5 g/L, 10 nm core + silica shell)</text>
<rect x="410" y="130" width="230" height="40" rx="4" fill="#3fb950" opacity="0.10" stroke="#3fb950" stroke-width="1"/>
<text x="525" y="147" fill="#3fb950" font-size="8" text-anchor="middle">2. Incubate 2–4h at 40°C</text>
<text x="525" y="163" fill="#3fb950" font-size="7" text-anchor="middle">(ester synthesis at aᵂ controlled by system)</text>
<rect x="410" y="180" width="230" height="40" rx="4" fill="#e8a665" opacity="0.10" stroke="#e8a665" stroke-width="1"/>
<text x="525" y="197" fill="#e8a665" font-size="8" text-anchor="middle">3. Apply magnet to jar wall</text>
<text x="525" y="213" fill="#e8a665" font-size="7" text-anchor="middle">(beads collect in seconds)</text>
<rect x="410" y="230" width="230" height="40" rx="4" fill="#d29922" opacity="0.10" stroke="#d29922" stroke-width="1"/>
<text x="525" y="247" fill="#d29922" font-size="8" text-anchor="middle">4. Decant spirit, reuse beads</text>
<text x="525" y="263" fill="#d29922" font-size="7" text-anchor="middle">(≥10 cycles before replacement)</text>
<rect x="410" y="285" width="230" height="80" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="303" fill="#e6edf3" font-size="8" text-anchor="middle">vs Conventional Recovery</text>
<line x1="420" y1="309" x2="630" y2="309" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="326" fill="#f85149" font-size="7" text-anchor="start">Filtration: clogs, loses enzyme</text>
<text x="425" y="342" fill="#f85149" font-size="7" text-anchor="start">Centrifugation: expensive equipment</text>
<text x="425" y="358" fill="#3fb950" font-size="7" text-anchor="start">Magnetic: $5 magnet, instant, gentle</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/><text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Fe₃O₄-CALB: magnetically recoverable lipase retains 85% activity after 10 reuse cycles</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">Magnetic separation replaces filtration — instant recovery with $5 neodymium magnet</text>
