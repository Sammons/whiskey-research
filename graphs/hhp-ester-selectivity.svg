<text x="612.8333333333334" y="314" fill="#e6edf3" font-size="7" text-anchor="start" transform="rotate(-45,612.8333333333334,314)">Ethyl decanoate</text>
<rect x="405" y="280" width="250" height="80" rx="4" fill="#30363d" opacity="0.7"/>
<text x="530" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Equilibrium enhancement at 400 MPa:</text>
<text x="530" y="309" fill="#e8a665" font-size="7" text-anchor="middle">Ethyl acetate: Kₚ/K₀ = 3.6×</text>
<text x="530" y="323" fill="#e8a665" font-size="7" text-anchor="middle">Ethyl butyrate: Kₚ/K₀ = 5.9×</text>
<text x="530" y="337" fill="#e8a665" font-size="7" text-anchor="middle">Ethyl hexanoate: Kₚ/K₀ = 9.6×</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">HHP at 400 MPa: +384% ethyl hexanoate (Zhu 2016). Pressure selects for LONG-CHAIN esters</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">because their formation has larger negative ΔV. Short-chain esters barely respond.</text>
