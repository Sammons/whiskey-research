<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" style="background:#161b22;font-family:Georgia,serif">
<rect width="700" height="480" fill="#161b22"/>
<text x="350" y="25" fill="#e8a665" font-size="14" text-anchor="middle" font-weight="bold">Fig V2-3 — Yield Mass Balance: Ethanol Accounting</text>
<text x="250" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">A: Ethanol Mass Balance (10 gal wash, 10% ABV)</text>
<rect x="60" y="75" width="120" height="35" rx="3" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
<text x="120" y="89" fill="#58a6ff" font-size="7" text-anchor="middle">10gal @ 10%ABV</text>
<text x="120" y="101" fill="#58a6ff" font-size="7" text-anchor="middle">1.00gal EtOH</text>
<line x1="180" y1="92.5" x2="200" y2="92.5" stroke="#e8a665" stroke-width="1.5"/>
<rect x="205" y="75" width="130" height="35" rx="3" fill="#e8a665" opacity="0.2" stroke="#e8a665" stroke-width="1"/>
<text x="270" y="89" fill="#e8a665" font-size="7" text-anchor="middle">STRIP RUN</text>
<text x="270" y="101" fill="#e8a665" font-size="6" text-anchor="middle">90% → 2.0gal LW@45%</text>
<text x="270" y="125" fill="#f85149" font-size="6" text-anchor="middle">↓ 0.10gal lost</text>
<line x1="335" y1="92.5" x2="355" y2="92.5" stroke="#e8a665" stroke-width="1.5"/>
<rect x="360" y="75.0" width="200" height="6.0" fill="#f85149" opacity="0.25" stroke="#f85149" stroke-width="1"/>
<text x="460" y="82" fill="#f85149" font-size="6" text-anchor="middle">Foreshots (3%)</text>
<rect x="360" y="81.0" width="200" height="24.0" fill="#d29922" opacity="0.25" stroke="#d29922" stroke-width="1"/>
<text x="460" y="97" fill="#d29922" font-size="6" text-anchor="middle">Heads (12%)</text>
<rect x="360" y="105.0" width="200" height="110.0" fill="#3fb950" opacity="0.25" stroke="#3fb950" stroke-width="1"/>
<text x="460" y="164" fill="#3fb950" font-size="6" text-anchor="middle">HEARTS (55%)</text>
<rect x="360" y="215.0" width="200" height="40.0" fill="#d29922" opacity="0.25" stroke="#d29922" stroke-width="1"/>
<text x="460" y="239" fill="#d29922" font-size="6" text-anchor="middle">Tails (20%)</text>
<rect x="360" y="255.0" width="200" height="20.0" fill="#8b949e" opacity="0.25" stroke="#8b949e" stroke-width="1"/>
<text x="460" y="269" fill="#8b949e" font-size="6" text-anchor="middle">Stillage (10%)</text>
<text x="460" y="67" fill="#e6edf3" font-size="8" text-anchor="middle">Spirit Run: Ethanol Fractions</text>
<rect x="360" y="295" width="200" height="40" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="1.5"/>
<text x="460" y="311" fill="#3fb950" font-size="8" text-anchor="middle">Hearts: 0.50gal EtOH @ ~66%ABV</text>
<text x="460" y="325" fill="#3fb950" font-size="7" text-anchor="middle">= 0.75gal spirit (2.8L)</text>
<text x="350" y="320" fill="#e6edf3" font-size="10" text-anchor="middle">B: Expected Yield by Scenario</text>
<text x="70" y="338" fill="#e8a665" font-size="7" text-anchor="start">Scenario</text>
<text x="250" y="338" fill="#e8a665" font-size="7" text-anchor="start">Charge</text>
<text x="400" y="338" fill="#e8a665" font-size="7" text-anchor="start">Hearts Yield</text>
<text x="540" y="338" fill="#e8a665" font-size="7" text-anchor="start">Hearts ABV</text>
<line x1="70" y1="342" x2="640" y2="342" stroke="#8b949e" stroke-width="0.5"/>
<text x="70" y="354" fill="#e6edf3" font-size="6" text-anchor="start">Single-pass from 10gal wash</text>
<text x="250" y="354" fill="#8b949e" font-size="6" text-anchor="start">10gal@10%</text>
<text x="400" y="354" fill="#3fb950" font-size="7" text-anchor="start">~0.8–1.2 gal</text>
<text x="540" y="354" fill="#8b949e" font-size="6" text-anchor="start">55–65%</text>
<text x="70" y="372" fill="#e6edf3" font-size="6" text-anchor="start">Two-pass (strip+spirit)</text>
<text x="250" y="372" fill="#8b949e" font-size="6" text-anchor="start">10gal@10%</text>
<text x="400" y="372" fill="#3fb950" font-size="7" text-anchor="start">~0.6–0.9 gal</text>
<text x="540" y="372" fill="#8b949e" font-size="6" text-anchor="start">65–72%</text>
<text x="70" y="390" fill="#e6edf3" font-size="6" text-anchor="start">Spirit from 8gal low wines</text>
<text x="250" y="390" fill="#8b949e" font-size="6" text-anchor="start">8gal@25–45%</text>
<text x="400" y="390" fill="#3fb950" font-size="7" text-anchor="start">~1.5–2.5 gal</text>
<text x="540" y="390" fill="#8b949e" font-size="6" text-anchor="start">65–72%</text>
<text x="350" y="420" fill="#e8a665" font-size="7" text-anchor="middle">Mass balance: 10gal×10%ABV / 65% = 1.54gal theoretical max</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/>
<text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Practical yield = charge×ABV / hearts_ABV × 0.5–0.7 (recovery)</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">Wider CRO hearts cut (55% vs 40%) increases yield ~30% vs pot still</text>
</svg>