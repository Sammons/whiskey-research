<text x="525" y="189" fill="#58a6ff" font-size="7" text-anchor="middle">Soap precipitates, removed by filter</text>
<rect x="410" y="210" width="230" height="130" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="228" fill="#e6edf3" font-size="8" text-anchor="middle">Key Advantages</text>
<line x1="420" y1="235" x2="630" y2="235" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="252" fill="#3fb950" font-size="7" text-anchor="start">• No chemical acid/base added</text>
<text x="425" y="268" fill="#3fb950" font-size="7" text-anchor="start">• H⁺/OH⁻ from water splitting at BPM</text>
<text x="425" y="284" fill="#3fb950" font-size="7" text-anchor="start">• Spirit returns to original pH</text>
<text x="425" y="300" fill="#3fb950" font-size="7" text-anchor="start">• Continuous flow operation</text>
<text x="425" y="316" fill="#e8a665" font-size="7" text-anchor="start">• Energy: ~1 kWh/L processed</text>
<text x="425" y="332" fill="#58a6ff" font-size="7" text-anchor="start">• Dual function: ester + deacidify</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/><text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">BPM electrodialysis: creates pH 1.5 / pH 12.5 zones from water splitting, no chemical addition</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">Acid chamber: 100× ester catalysis; base chamber: fatty acid saponification + removal</text>
