<text x="525" y="97" fill="#3fb950" font-size="8" text-anchor="middle">Chitosan: β-(1→4)-D-glucosamine</text>
<text x="525" y="112" fill="#3fb950" font-size="7" text-anchor="middle">Free –NH₂ groups (60–90% deacetylation)</text>
<text x="525" y="127" fill="#8b949e" font-size="7" text-anchor="middle">GRAS, from shrimp/crab shells, $5/kg</text>
<rect x="410" y="150" width="230" height="90" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="168" fill="#e6edf3" font-size="8" text-anchor="middle">Selectivity Mechanism</text>
<line x1="420" y1="175" x2="630" y2="175" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="192" fill="#f85149" font-size="7" text-anchor="start">–NH₂ + R–OH → H-bond (fusel)</text>
<text x="425" y="208" fill="#bc8cff" font-size="7" text-anchor="start">–NH₂ + ArOH → H-bond (phenol)</text>
<text x="425" y="224" fill="#3fb950" font-size="7" text-anchor="start">–NH₂ + RCOOR' → weak (ester kept)</text>
<rect x="410" y="255" width="230" height="70" rx="4" fill="#58a6ff" opacity="0.10" stroke="#58a6ff" stroke-width="1"/>
<text x="525" y="273" fill="#58a6ff" font-size="8" text-anchor="middle">Cu²⁺-Chitosan Enhancement</text>
<text x="525" y="290" fill="#58a6ff" font-size="7" text-anchor="middle">Lewis acid coordination with fusel –OH</text>
<text x="525" y="305" fill="#58a6ff" font-size="7" text-anchor="middle">+40% selectivity vs plain chitosan</text>
<text x="525" y="317" fill="#8b949e" font-size="7" text-anchor="middle">Cu²⁺ chelated → no leaching</text>
<rect x="410" y="335" width="230" height="55" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="353" fill="#e6edf3" font-size="8" text-anchor="middle">vs Activated Carbon</text>
<text x="525" y="368" fill="#f85149" font-size="7" text-anchor="middle">AC: removes everything non-selectively</text>
<text x="525" y="383" fill="#3fb950" font-size="7" text-anchor="middle">Chitosan: 85% fusel, only 15% ester loss</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/><text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Chitosan selectively adsorbs fusel alcohols (85%) while retaining esters (85% preserved)</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">GRAS biopolymer, $5/kg, Cu²⁺-chelated form adds +40% selectivity vs plain chitosan</text>
