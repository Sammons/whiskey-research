<text x="525" y="238" fill="#e6edf3" font-size="8" text-anchor="middle">Key Advantages</text>
<line x1="420" y1="245" x2="630" y2="245" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="262" fill="#3fb950" font-size="7" text-anchor="start">• Mixing ≠ flow rate (independent)</text>
<text x="425" y="278" fill="#3fb950" font-size="7" text-anchor="start">• Plug flow at low Re (no channeling)</text>
<text x="425" y="294" fill="#3fb950" font-size="7" text-anchor="start">• Oscillation: 0.5–10 Hz, 1–30 mm</text>
<text x="425" y="310" fill="#58a6ff" font-size="7" text-anchor="start">• 50× smaller than batch for same</text>
<text x="425" y="326" fill="#58a6ff" font-size="7" text-anchor="start">   conversion (process intensification)</text>
<text x="425" y="342" fill="#e8a665" font-size="7" text-anchor="start">• Continuous: catalyst + mol. sieve</text>
