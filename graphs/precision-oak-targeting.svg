<text x="258" y="82" fill="#3fb950" font-size="6" text-anchor="start">Q. petraea</text>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Extraction Method Selectivity</text>
<rect x="395" y="70" width="280" height="30" rx="3" fill="#e8a665" opacity="0.10"/>
<text x="403" y="83" fill="#e8a665" font-size="7" text-anchor="start">NADES (Xu 2024)</text>
<text x="545" y="83" fill="#e6edf3" font-size="7" text-anchor="start">→ Vanillin</text>
<text x="545" y="95" fill="#8b949e" font-size="6" text-anchor="start">18.5 mg/g</text>
<rect x="395" y="106" width="280" height="30" rx="3" fill="#3fb950" opacity="0.10"/>
<text x="403" y="119" fill="#3fb950" font-size="7" text-anchor="start">DES ChCl/tartaric</text>
<text x="545" y="119" fill="#e6edf3" font-size="7" text-anchor="start">→ Ellagitannins</text>
<text x="545" y="131" fill="#8b949e" font-size="6" text-anchor="start">selective</text>
<rect x="395" y="142" width="280" height="30" rx="3" fill="#58a6ff" opacity="0.10"/>
<text x="403" y="155" fill="#58a6ff" font-size="7" text-anchor="start">DES ChCl/lactic</text>
<text x="545" y="155" fill="#e6edf3" font-size="7" text-anchor="start">→ Lignin aromatics</text>
<text x="545" y="167" fill="#8b949e" font-size="6" text-anchor="start">vanillin+syringal</text>
<rect x="395" y="178" width="280" height="30" rx="3" fill="#bc8cff" opacity="0.10"/>
<text x="403" y="191" fill="#bc8cff" font-size="7" text-anchor="start">scCO₂ (Nardella)</text>
<text x="545" y="191" fill="#e6edf3" font-size="7" text-anchor="start">→ Lactones</text>
<text x="545" y="203" fill="#8b949e" font-size="6" text-anchor="start">8±3 μg/g</text>
<rect x="395" y="214" width="280" height="30" rx="3" fill="#39d2c0" opacity="0.10"/>
<text x="403" y="227" fill="#39d2c0" font-size="7" text-anchor="start">UAE (§4.65)</text>
<text x="545" y="227" fill="#e6edf3" font-size="7" text-anchor="start">→ Total phenolics</text>
<text x="545" y="239" fill="#8b949e" font-size="6" text-anchor="start">116.5% more</text>
<text x="525" y="260" fill="#e6edf3" font-size="10" text-anchor="middle">C: Sensory Thresholds for Precision Dosing</text>
<rect x="395" y="278" width="280" height="100" rx="4" fill="#30363d" opacity="0.7"/>
<text x="403" y="300" fill="#e6edf3" font-size="7" text-anchor="start">Vanillin</text>
<text x="495" y="300" fill="#e8a665" font-size="7" text-anchor="start">1 mg/L</text>
<text x="570" y="300" fill="#8b949e" font-size="7" text-anchor="start">vanilla, sweet</text>
<text x="403" y="322" fill="#e6edf3" font-size="7" text-anchor="start">Eugenol</text>
<text x="495" y="322" fill="#e8a665" font-size="7" text-anchor="start">6 μg/L</text>
<text x="570" y="322" fill="#8b949e" font-size="7" text-anchor="start">clove, spice</text>
<text x="403" y="344" fill="#e6edf3" font-size="7" text-anchor="start">cis-Oak lactone</text>
<text x="495" y="344" fill="#e8a665" font-size="7" text-anchor="start">20–46 μg/L</text>
<text x="570" y="344" fill="#8b949e" font-size="7" text-anchor="start">woody, coconut</text>
<text x="403" y="366" fill="#e6edf3" font-size="7" text-anchor="start">Furfural</text>
<text x="495" y="366" fill="#e8a665" font-size="7" text-anchor="start">14 mg/L</text>
<text x="570" y="366" fill="#8b949e" font-size="7" text-anchor="start">caramel, bread</text>
<text x="525" y="400" fill="#e6edf3" font-size="10" text-anchor="middle">D: Precision Aging Workflow</text>
<text x="400" y="415" fill="#e8a665" font-size="7" text-anchor="start">1. Target profile</text>
<text x="540" y="415" fill="#8b949e" font-size="6" text-anchor="start">Choose flavor descriptors</text>
<text x="400" y="431" fill="#58a6ff" font-size="7" text-anchor="start">2. Select oak</text>
<text x="540" y="431" fill="#8b949e" font-size="6" text-anchor="start">Species + toast from Tarko 2023 data</text>
<text x="400" y="447" fill="#3fb950" font-size="7" text-anchor="start">3. Match method</text>
<text x="540" y="447" fill="#8b949e" font-size="6" text-anchor="start">NADES/DES/scCO₂/UAE per target</text>
<text x="400" y="463" fill="#39d2c0" font-size="7" text-anchor="start">4. Dose to threshold</text>
<text x="540" y="463" fill="#8b949e" font-size="6" text-anchor="start">Calculate μg/g × oak load = mg/L</text>
</svg>