<line x1="475" y1="48" x2="493" y2="48" stroke="#58a6ff" stroke-width="2"/>
<text x="498" y="52" fill="#e6edf3" font-size="8" text-anchor="start">ΔV = -5 cm³/mol (conservative)</text>
<line x1="475" y1="66" x2="493" y2="66" stroke="#3fb950" stroke-width="2"/>
<text x="498" y="70" fill="#e6edf3" font-size="8" text-anchor="start">ΔV = -10 cm³/mol (measured)</text>
<line x1="475" y1="84" x2="493" y2="84" stroke="#39d2c0" stroke-width="2"/>
<text x="498" y="88" fill="#e6edf3" font-size="8" text-anchor="start">ΔV = -15 cm³/mol (high solvation)</text>
<line x1="475" y1="102" x2="493" y2="102" stroke="#f85149" stroke-width="2"/>
<text x="498" y="106" fill="#e6edf3" font-size="8" text-anchor="start">ΔV = +0.3 cm³/mol (neat, no solvation)</text>
<text x="475" y="138" fill="#e8a665" font-size="10" text-anchor="start">Le Chatelier principle:</text>
<text x="475" y="154" fill="#e6edf3" font-size="9" text-anchor="start">ln(Kₚ/K₀) = −ΔV⋅ΔP/(RT)</text>
<text x="475" y="178" fill="#3fb950" font-size="10" text-anchor="start">At 400 MPa, ΔV = −10:</text>
<text x="475" y="194" fill="#3fb950" font-size="9" text-anchor="start">Kₑₗ = 20 (5× shift)</text>
<text x="475" y="207" fill="#3fb950" font-size="9" text-anchor="start">→ 80% conversion</text>
<text x="475" y="220" fill="#e6edf3" font-size="9" text-anchor="start">(vs 45% at 1 atm)</text>
<text x="475" y="244" fill="#e8a665" font-size="10" text-anchor="start">HPP (300–600 MPa) is</text>
<text x="475" y="260" fill="#e6edf3" font-size="9" text-anchor="start">commercial for beverages</text>
<text x="475" y="273" fill="#e6edf3" font-size="9" text-anchor="start">(juices, guacamole, etc.)</text>
<text x="475" y="296" fill="#f85149" font-size="10" text-anchor="start">Critical uncertainty:</text>
<text x="475" y="312" fill="#e6edf3" font-size="9" text-anchor="start">Measured ΔV for ethyl</text>
<text x="475" y="325" fill="#e6edf3" font-size="9" text-anchor="start">acetate formation in 40%</text>
<text x="475" y="338" fill="#f85149" font-size="9" text-anchor="start">ABV has NOT been measured</text>
</svg>