<text x="525" y="175" fill="#8b949e" font-size="7" text-anchor="middle">Decarboxylation</text>
<rect x="410" y="200" width="230" height="40" rx="4" fill="#3fb950" opacity="0.10" stroke="#3fb950" stroke-width="1"/><text x="525" y="216" fill="#3fb950" font-size="8" text-anchor="middle">2 R· → R-R</text>
<text x="525" y="230" fill="#8b949e" font-size="7" text-anchor="middle">Radical coupling</text>
<rect x="410" y="265" width="230" height="95" rx="4" fill="#e8a665" opacity="0.10" stroke="#e8a665" stroke-width="1.5"/><text x="525" y="282" fill="#e8a665" font-size="8" text-anchor="middle">Spirit Application:</text>
<text x="525" y="298" fill="#3fb950" font-size="7" text-anchor="middle">Acetic acid → ethane + CO₂</text>
<text x="525" y="312" fill="#58a6ff" font-size="7" text-anchor="middle">Hexanoic acid → decane + CO₂</text>
<text x="525" y="326" fill="#8b949e" font-size="7" text-anchor="middle">Selective acid removal without</text>
<text x="525" y="338" fill="#8b949e" font-size="7" text-anchor="middle">disturbing ester equilibrium</text>
<text x="525" y="352" fill="#3fb950" font-size="7" text-anchor="middle">Gaseous products self-separate</text>
