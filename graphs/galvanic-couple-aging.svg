<text x="460" y="123" fill="#58a6ff" font-size="7" text-anchor="middle">Zn → Zn²⁺ + 2e⁻</text>
<text x="460" y="137" fill="#8b949e" font-size="7" text-anchor="middle">(dissolves slowly)</text>
<rect x="540" y="85" width="100" height="60" rx="4" fill="#e8a665" opacity="0.12" stroke="#e8a665" stroke-width="1.5"/>
