<text x="425" y="302" fill="#3fb950" font-size="7" text-anchor="start">• Zero electricity (self-powered)</text>
<text x="425" y="318" fill="#3fb950" font-size="7" text-anchor="start">• Self-limiting (passivation layer)</text>
<text x="425" y="334" fill="#e8a665" font-size="7" text-anchor="start">• Cu: traditional in pot stills</text>
<text x="425" y="350" fill="#58a6ff" font-size="7" text-anchor="start">• Zn: GRAS nutrient ($2/kg)</text>
