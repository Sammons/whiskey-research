<text x="395" y="73" fill="#58a6ff" font-size="10" text-anchor="start">COLD PHASE (−40°C, 2h)</text>
<text x="395" y="90" fill="#e6edf3" font-size="8" text-anchor="start">• Ice excludes EtOH → 60% ABV concentrate</text>
<text x="395" y="104" fill="#e6edf3" font-size="8" text-anchor="start">• Kₑₖ shifts: 58% → 72% ester conv.</text>
<text x="395" y="118" fill="#e6edf3" font-size="8" text-anchor="start">• D1*→D2* hydrate transition (§1.16)</text>
<text x="395" y="132" fill="#e6edf3" font-size="8" text-anchor="start">• H-bond network reorganization</text>
<text x="395" y="146" fill="#e6edf3" font-size="8" text-anchor="start">• Dissolved gas supersaturation</text>
<text x="395" y="160" fill="#39d2c0" font-size="8" text-anchor="start">Barriers: ESTER + CLUSTER + SULFUR</text>
<rect x="385.0" y="185.0" width="250" height="120" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="1"/>
<text x="395" y="203" fill="#f85149" font-size="10" text-anchor="start">WARM PHASE (50°C, 4h)</text>
<text x="395" y="220" fill="#e6edf3" font-size="8" text-anchor="start">• Ultrasonic extraction (40 kHz)</text>
<text x="395" y="234" fill="#e6edf3" font-size="8" text-anchor="start">• PDMS O₂ + electro-Fenton</text>
<text x="395" y="248" fill="#e6edf3" font-size="8" text-anchor="start">• Riboflavin ¹O₂ photocatalysis</text>
<text x="395" y="262" fill="#e6edf3" font-size="8" text-anchor="start">• Temperature-driven reaction kinetics</text>
<text x="395" y="276" fill="#e6edf3" font-size="8" text-anchor="start">• Gas bubble nucleation (from cold SS)</text>
<text x="395" y="290" fill="#39d2c0" font-size="8" text-anchor="start">Barriers: OXIDATION + EXTRACTION + CLUSTER</text>
<rect x="385.0" y="320.0" width="250" height="60" rx="4" fill="#30363d" opacity="0.8"/>
<text x="395" y="338" fill="#e8a665" font-size="9" text-anchor="start">Thermal shock synergies:</text>
<text x="395" y="352" fill="#3fb950" font-size="8" text-anchor="start">• Gas SS from ΔT → cavitation nuclei</text>
<text x="395" y="366" fill="#d29922" font-size="8" text-anchor="start">• Ester ratchet: Kₑₖ shift is irreversible</text>
