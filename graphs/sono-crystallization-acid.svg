<text x="110" y="126" fill="#bc8cff" font-size="7" text-anchor="start">Ca-fatty acid (waxy)</text>
<text x="525" y="57" fill="#e6edf3" font-size="10" text-anchor="middle">B: Sono-Crystallization Process</text>
<rect x="390" y="65" width="270" height="310" fill="none" stroke="#8b949e" stroke-width="1"/>
<rect x="410" y="80" width="230" height="45" rx="4" fill="#58a6ff" opacity="0.10" stroke="#58a6ff" stroke-width="1"/>
<text x="525" y="97" fill="#58a6ff" font-size="8" text-anchor="middle">1. Add Ca²⁺ or K⁺ seed ions</text>
<text x="525" y="113" fill="#58a6ff" font-size="7" text-anchor="middle">CaCl₂ (5 mM) or KCl (10 mM)</text>
<rect x="410" y="135" width="230" height="45" rx="4" fill="#3fb950" opacity="0.10" stroke="#3fb950" stroke-width="1"/>
<text x="525" y="152" fill="#3fb950" font-size="8" text-anchor="middle">2. Ultrasonic treatment (20–40 kHz)</text>
<text x="525" y="168" fill="#3fb950" font-size="7" text-anchor="middle">30–60 W/L for 10–30 min</text>
<rect x="410" y="190" width="230" height="45" rx="4" fill="#e8a665" opacity="0.10" stroke="#e8a665" stroke-width="1"/>
<text x="525" y="207" fill="#e8a665" font-size="8" text-anchor="middle">3. Filter crystals (0.45 μm)</text>
<text x="525" y="223" fill="#e8a665" font-size="7" text-anchor="middle">Remove precipitated acid salts</text>
<rect x="410" y="250" width="230" height="55" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="268" fill="#e6edf3" font-size="8" text-anchor="middle">Result: Selective Deacidification</text>
<line x1="420" y1="275" x2="630" y2="275" stroke="#8b949e" stroke-width="0.5"/>
<text x="425" y="292" fill="#3fb950" font-size="7" text-anchor="start">Oxalic/tartaric acids: 70–90% removed</text>
<text x="425" y="308" fill="#3fb950" font-size="7" text-anchor="start">Esters: 100% retained (soluble)</text>
<rect x="410" y="320" width="230" height="55" rx="4" fill="#30363d" opacity="0.5"/>
<text x="525" y="338" fill="#e6edf3" font-size="8" text-anchor="middle">vs Alternatives</text>
<text x="425" y="355" fill="#f85149" font-size="7" text-anchor="start">NaOH neutralization: changes pH, off-flavors</text>
<text x="425" y="371" fill="#3fb950" font-size="7" text-anchor="start">Sono-cryst: no pH change, no reagent residue</text>
<rect x="60" y="430" width="580" height="38" rx="4" fill="#30363d" opacity="0.85"/><text x="350" y="448" fill="#e8a665" font-size="8" text-anchor="middle">Sono-crystallization: ultrasound drives selective precipitation of harsh acid salts</text>
<text x="350" y="462" fill="#3fb950" font-size="8" text-anchor="middle">70–90% oxalic/tartaric removal while retaining 100% of volatile esters in solution</text>
</svg>